
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛜 RSSWire Playground</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 16px;
      background: #111;
      color: white;
      font-weight: 600;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>RSSWire Playground</header>

  <iframe
    src="https://playground.wordpress.net/?blueprint-url=https%3A%2F%2Fraw.githubusercontent.com%2Fthoffical%2Ftry-rsswire%2Frefs%2Fheads%2Fmain%2Fblueprint.json"
    title="WordPress Playground with RSSWire"
    allow="clipboard-read; clipboard-write"
    loading="eager">
  </iframe>
</body>
</html>
